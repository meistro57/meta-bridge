# sources.yaml — Meta Bridge source catalog
# The ingest pipeline checks this file first before running LLM metadata extraction.
# Fields:
#   id           - stable snake_case identifier (used as Qdrant source key)
#   title        - full book/work title
#   author       - human author or scribe
#   year         - publication/copyright year (0 if unknown)
#   channel_type - authored | channeled | regression | dictated | dramatized | dialogue
#   tradition    - named source tradition (empty if none)
#   medium       - claimed non-human source or entity (empty if none)
#   file         - exact filename in incoming/ directory
#   skip         - true to exclude from pipeline (corrupt, irrelevant, duplicate)
#   notes        - optional human notes

